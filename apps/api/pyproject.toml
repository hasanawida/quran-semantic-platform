[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-semantic-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.20,<0.22",
  "asyncpg>=0.31,<0.32",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.10,<3",
  "pydantic[email]>=2.10,<3",
  "pyjwt>=2.9,<3",
  "redis>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<0.29",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
