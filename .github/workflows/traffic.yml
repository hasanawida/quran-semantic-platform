name: Repo traffic snapshot

# ما يقيسه وما لا يقيسه — والفرق ليس تفصيلًا:
#
# يقيس مشاهدات **صفحة المستودع على github.com** ونسخه (clones).
# ولا يقيس زيارات الموقع المنشور على GitHub Pages: تلك سجلّات عند GitHub
# لا تُصدَّر لصاحب الموقع. لقياس زوّار الموقع نفسه انظر قسم «قياس
# الاستعمال» في docs/DEPLOYMENT_AR.md.
#
# ولماذا يوميًا: نافذة الواجهة أربعة عشر يومًا فقط، فما لا يُلتقط يسقط
# بلا رجعة. واللقطة تُدمج في سجل تراكمي لا تُلحق به.

on:
  schedule:
    # 03:17 UTC — بعيدًا عن رأس الساعة حيث تزدحم طوابير GitHub
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # الكتابة للالتزام بالسجل التراكمي — وهي أقصى ما يفيد هنا.
  #
  # **حدٌّ مُختبَر لا مفترَض:** واجهة traffic تشترط صلاحية إدارة
  # المستودع، ورمز GitHub التلقائي لا يملكها ولا يُمنح إياها:
  # `administration` ليست مفتاحًا مقبولًا في permissions أصلًا (يردّ
  # GitHub بـ422)، والتشغيل بـcontents وحدها ردّ 403. فيلزم رمز شخصي،
  # وإنشاؤه بيد صاحب المستودع لا بيد أحد سواه.
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # يتخطّى بوضوح بدل أن يفشل: بلا الرمز الشخصي لا شيء يمكن جلبه،
      # وسيرٌ أحمرُ كل يوم بلا سبب يُصلَح يُعلَّم ضجيجًا فيُهمَل — ثم
      # يُهمَل معه ما يستحق الانتباه.
      - name: Fetch traffic
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::سرّ TRAFFIC_TOKEN غير مضبوط — تُخطّى اللقطة."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/traffic/views" > /tmp/views.json
          gh api "repos/${GITHUB_REPOSITORY}/traffic/clones" > /tmp/clones.json
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Merge into history
        if: steps.fetch.outputs.skipped == 'false'
        run: |
          python3 scripts/repo-traffic/merge_traffic.py \
            /tmp/views.json /tmp/clones.json docs/traffic/repo-traffic.csv

      - name: Commit if changed
        if: steps.fetch.outputs.skipped == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/traffic/repo-traffic.csv
          # لا التزام فارغ: أكثر الأيام لا يتغيّر فيها شيء
          git diff --cached --quiet || \
            git commit -m "chore(traffic): لقطة يومية لحركة المستودع"
          git push
