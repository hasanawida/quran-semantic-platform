name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # لقطة الحركة تكتب في docs/traffic/ وحدها، ولا معنى لإعادة بناء
    # الموقع كله ونشره من أجلها.
    paths-ignore:
      - "docs/traffic/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # موقع مشروع: /quran-semantic-platform  ·  موقع مستخدم: اتركها فارغة
  BASE_PATH: /quran-semantic-platform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # [dev] لأجل pytest: الحُرّاس أدناه تُشغَّل به لا بالتطبيق وحده
      - name: Install API package (for app.utils.arabic)
        run: pip install -e "apps/api[dev]"

      # البيانات أولًا: البناء يقرأ surahs.json بـfs في generateStaticParams
      - name: Generate static data
        env:
          QSP_DATA_DIR: ${{ github.workspace }}/apps/api/data
        run: python scripts/export-static/build_data.py

      - name: No scripture in source
        working-directory: apps/api
        run: pytest tests/test_no_scripture_in_source.py -q

      # حارسا المعجم: صدقُ وسم المراجعة، ونسَبُ كل اقتباس. واقتباسٌ لا
      # يطابق المصحف ولا هو معلَنٌ حديثًا قد يكون آيةً نُسخت خطأً — وذاك
      # تحريفٌ يُنشر باسم المصحف، فلا يُبنى الموقعُ وفيه واحد.
      - name: Lexicon labels and quotes
        working-directory: apps/api
        run: pytest tests/test_lexicon_sihah.py tests/test_lexicon_quotes.py tests/test_lexicon_openiti.py tests/test_tafsir.py -q

      # حارس الروابط: رابط إلى مسار محذوف لا يكشفه مترجم ولا بناء —
      # `<Link href>` نصٌّ حرّ — ولا يظهر إلا حين يضغط مستعمل فيصل 404.
      - name: Internal links resolve
        working-directory: apps/api
        run: pytest tests/test_static_links.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci

      # بعد npm ci لا قبله: الحارس يترجم normalize.ts بـtsc، وtsc يأتي
      # من node_modules الواجهة. وموضعه هنا **قبل البناء** مقصود: انحراف
      # التطبيع يوقف النشرة ولا يصل إلى الناس بحثًا يعيد صفرًا صامتًا.
      - name: Normalizer parity (browser vs python)
        working-directory: apps/api
        run: pytest tests/test_browser_normalizer_matches_python.py -q

      - name: Build static export
        working-directory: apps/web
        env:
          QSP_STATIC: "1"
          NEXT_PUBLIC_QSP_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          # بصمة البناء — بها وحدها يُبطَل مخزن عامل الخدمة عند كل نشر
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          # قياس الاستعمال: يُفعَّل بإضافة متغيّر المستودع UMAMI_ID
          # (Settings ▸ Secrets and variables ▸ Actions ▸ Variables).
          # بلا ضبطه لا يُشحن نصٌّ خارجي، والموقع كما هو اليوم.
          # وما يُجمع مصرَّحٌ به كاملًا في صفحة /privacy.
          NEXT_PUBLIC_UMAMI_ID: ${{ vars.UMAMI_ID }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # Jekyll يحذف كل مجلد يبدأ بشرطة سفلية — أي `_next` كله
      - name: Disable Jekyll
        run: touch apps/web/out/.nojekyll

      - name: Enforce size budget
        run: |
          BYTES=$(du -sb apps/web/out | cut -f1)
          FILES=$(find apps/web/out -type f | wc -l)
          echo "out/ = $BYTES bytes in $FILES files"
          # المقيس بعد دخول المعاجم الأربعة وتفاسير الخمسة:
          # ≈ 90 م.ب في ≈ 2800 ملف. رُفع السقف إلى 160 م.ب و6000 ملف
          # ليتسع للنمو المعلوم ويبقى كاشفًا للانفجار غير المقصود.
          # والقارئ لا يجلب هذا كلَّه: التفسير مشظًّى بالكتاب والسورة،
          # والمعاجم بالجذر، فلا يُحمَّل إلا ما يفتحه.
          test "$BYTES" -lt 167772160
          test "$FILES" -lt 6000
          test -f apps/web/out/data/v1/manifest.json
          test -f apps/web/out/mushaf/114/index.html
          test -f apps/web/out/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
