name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: apps/api
        run: pip install ".[dev]"
      - name: Lint
        working-directory: apps/api
        run: ruff check .
      - name: Lint import scripts
        run: ruff check scripts
      # الهجرات تُختبر ذهابًا وإيابًا: مخطط لا يمكن التراجع عنه خطر تشغيلي
      - name: Migrations round-trip
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      # حزم البيانات شرطٌ لكل ما بعدها: بدونها لا نصّ ولا صرف. تُفحص
      # مستقلةً وأولًا حتى يكون الفشل مقروءًا — أول تشغيل لـCI سقط بـ99
      # اختبارًا كلها BUNDLE_MISSING، وأخذ تشخيصها وقتًا لأن الفشل ظهر
      # في المخرجات لا في سببه.
      - name: Data bundles
        working-directory: apps/api
        # التصريح بالمجلد كما يفعل الإنتاج (ENV QSP_DATA_DIR في Dockerfile)
        env:
          QSP_DATA_DIR: ${{ github.workspace }}/apps/api/data
        run: pytest tests/test_data_paths.py -q
      - name: Test
        working-directory: apps/api
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # البيانات قبل البناء. `generateStaticParams` في /mushaf/[surah]
      # يقرأ public/data/v1/surahs.json بـfs، فبدونها يسقط البناء بـENOENT
      # قبل أن يصل إلى صفحة واحدة. نشرة الصفحات تفعل هذا وتنجح؛ وهذه
      # الوظيفة لم تكن تفعله فبقيت حمراء ستة التزامات دون أن يوقف ذلك شيئًا.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API package (for app.utils.arabic)
        run: pip install -e apps/api
      - name: Generate static data
        env:
          QSP_DATA_DIR: ${{ github.workspace }}/apps/api/data
        run: python scripts/export-static/build_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      # بناء الوضع المحلي (standalone) لا الثابت: يغطّي صفحات
      # `page.node.tsx` التي يُسقطها التصدير الثابت، فيبقى المسار
      # الكامل مفحوصًا. والتصدير الثابت تفحصه نشرة الصفحات.
      - name: Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
